name: Nightly proxy update

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip commit, push, and deploy'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nightly-update
  cancel-in-progress: false

jobs:
  update-and-publish:
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install pytest
        run: pip install pytest==9.0.3

      - name: Run tests
        run: pytest tests/ -v

      - name: Update proxies
        env:
          TG_MCP_BEARER: ${{ secrets.TG_MCP_BEARER }}
        run: python update_proxies.py

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet docs/proxies.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: >-
          steps.changes.outputs.changed == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/proxies.txt
          git commit -m "Update proxies $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Setup Pages
        if: >-
          steps.changes.outputs.changed == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: >-
          steps.changes.outputs.changed == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: >-
          steps.changes.outputs.changed == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        id: deployment
        uses: actions/deploy-pages@v4
