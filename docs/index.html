<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Proxy List — tgproxy.l1979.ru</title>
    <meta name="description" content="Auto-updated list of Telegram proxy servers from @telemtrs Free proxy topic">
    <meta name="author" content="leshchenko1979">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%234fc3f7'/><circle cx='50' cy='50' r='20' fill='%231a1a2e'/><circle cx='50' cy='50' r='8' fill='%234fc3f7'/></svg>">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 0.5rem;
            color: #4fc3f7;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }
        .proxy-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .date-divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.5rem 0 0.75rem;
            color: #888;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .date-divider::before,
        .date-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #333;
        }
        .date-divider-text {
            color: #4fc3f7;
            white-space: nowrap;
        }
        .proxy-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: #16213e;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #0f3460;
        }
        .proxy-url {
            flex: 1;
            font-family: monospace;
            font-size: 0.85rem;
            color: #81d4fa;
            word-break: break-all;
        }
        .proxy-url:hover {
            color: #4fc3f7;
        }
        .copy-btn {
            background: #4fc3f7;
            color: #1a1a2e;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.2s;
            min-width: 80px;
        }
        .copy-btn:hover {
            background: #29b6f6;
        }
        .copy-btn:focus-visible {
            outline: 2px solid #81d4fa;
            outline-offset: 2px;
        }
        .copy-btn.copied {
            background: #66bb6a;
        }
        .state {
            text-align: center;
            color: #888;
            padding: 2rem;
        }
        .count {
            text-align: center;
            color: #666;
            margin-bottom: 1.5rem;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📡 Telegram Proxy List</h1>
        <p class="subtitle">Auto-updated daily from @telemtrs — Free proxy topic</p>
        <p class="count" id="count"></p>
        <div class="proxy-list" id="proxy-list">
            <div class="state">Loading...</div>
        </div>
    </div>

    <script>
        const MONTHS = [
            'January', 'February', 'March', 'April', 'May', 'June',
            'July', 'August', 'September', 'October', 'November', 'December'
        ];

        function formatDate(dateStr) {
            // dateStr is YYYY-MM-DD
            const [year, month, day] = dateStr.split('-').map(Number);
            return MONTHS[month - 1] + ' ' + day + ', ' + year;
        }

        function parseProxies(lines) {
            // Returns array of {url, timestamp, date} objects
            // timestamp is ISO string YYYY-MM-DDTHH:MM:SS or empty
            // date is YYYY-MM-DD or empty string
            const result = [];
            for (const line of lines) {
                const trimmed = line.trim();
                if (!trimmed) continue;

                let url, timestamp;
                if (trimmed.includes('|')) {
                    const lastSep = trimmed.lastIndexOf('|');
                    url = trimmed.substring(0, lastSep);
                    timestamp = trimmed.substring(lastSep + 1);
                } else {
                    url = trimmed;
                    timestamp = '';
                }

                const date = timestamp ? timestamp.substring(0, 10) : '';
                result.push({ url, timestamp, date });
            }
            return result;
        }

        function groupByDate(proxies) {
            // Groups proxies by date, sorts groups by date DESC
            // Returns array of {date, label, proxies} where date is YYYY-MM-DD or '' for unknown
            const groups = {};
            const today = new Date().toISOString().substring(0, 10);
            const yesterday = new Date(Date.now() - 86400000).toISOString().substring(0, 10);

            for (const p of proxies) {
                let label;
                if (!p.date) {
                    label = 'Unknown date';
                } else if (p.date === today) {
                    label = 'Today';
                } else if (p.date === yesterday) {
                    label = 'Yesterday';
                } else {
                    label = formatDate(p.date);
                }

                if (!groups[label]) {
                    groups[label] = {
                        date: p.date || '',
                        label: label,
                        proxies: []
                    };
                }
                groups[label].proxies.push(p);
            }

            // Sort groups by date DESC (newest first)
            // Unknown date goes last
            const sorted = Object.values(groups).sort((a, b) => {
                if (a.date === '') return 1;  // unknown last
                if (b.date === '') return -1;
                // Descending: a > b means a comes first (newer date)
                if (a.date > b.date) return -1;
                if (a.date < b.date) return 1;
                return 0;
            });

            return sorted;
        }

        async function loadProxies() {
            const container = document.getElementById('proxy-list');
            const countEl = document.getElementById('count');

            try {
                const response = await fetch('./proxies.txt');
                if (!response.ok) {
                    throw new Error('Failed to fetch: ' + response.status);
                }
                const text = await response.text();
                const lines = text.trim().split('\n');

                const proxies = parseProxies(lines);
                const groups = groupByDate(proxies);

                const totalProxies = proxies.length;
                countEl.textContent = totalProxies + ' proxy(ies)';

                if (totalProxies === 0) {
                    container.innerHTML = '<div class="state">No proxies yet. Check back later.</div>';
                    return;
                }

                container.innerHTML = '';

                for (const group of groups) {
                    // Add date divider
                    const divider = document.createElement('div');
                    divider.className = 'date-divider';
                    divider.innerHTML = '<span class="date-divider-text">' + group.label + '</span>';
                    container.appendChild(divider);

                    // Add proxies in this group (already sorted by timestamp DESC within group)
                    for (const p of group.proxies) {
                        const item = document.createElement('div');
                        item.className = 'proxy-item';

                        const link = document.createElement('a');
                        link.className = 'proxy-url';
                        link.href = p.url;
                        link.target = '_blank';
                        link.rel = 'noopener noreferrer';
                        link.textContent = p.url;

                        const btn = document.createElement('button');
                        btn.className = 'copy-btn';
                        btn.setAttribute('aria-label', 'Copy proxy URL');
                        btn.dataset.url = p.url;
                        btn.textContent = 'Copy';

                        item.appendChild(link);
                        item.appendChild(btn);
                        container.appendChild(item);
                    }
                }
            } catch (err) {
                countEl.textContent = '';
                container.innerHTML = '<div class="state">Failed to load proxies. Refresh to retry.</div>';
            }
        }

        document.addEventListener('click', function(e) {
            const btn = e.target.closest('.copy-btn');
            if (!btn) return;

            const url = btn.dataset.url;
            if (!url) return;

            if (!navigator.clipboard) {
                btn.textContent = 'No API';
                return;
            }
            navigator.clipboard.writeText(url).then(() => {
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = 'Copy';
                    btn.classList.remove('copied');
                }, 1500);
            }).catch(() => {
                btn.textContent = 'Error';
                setTimeout(() => {
                    btn.textContent = 'Copy';
                }, 1500);
            });
        });

        loadProxies();
    </script>
</body>
</html>
