    <script>
        // Content-hashed so GitHub Pages / browser cache cannot reuse an old list.
        const PROXIES_URL = './proxies-6236693ecf76.txt';

        const MONTHS = [
            'January', 'February', 'March', 'April', 'May', 'June',
            'July', 'August', 'September', 'October', 'November', 'December'
        ];

        function formatDate(dateStr) {
            // dateStr is YYYY-MM-DD
            const [year, month, day] = dateStr.split('-').map(Number);
            return MONTHS[month - 1] + ' ' + day + ', ' + year;
        }

        function toTgUrl(url) {
            if (url.startsWith('tg://')) return url;
            const match = url.match(/^https:\/\/t\.me\/(proxy|socks|killer)\?(.+)$/);
            return match ? 'tg://' + match[1] + '?' + match[2] : url;
        }

        function parseProxies(lines) {
            // Returns array of {url, timestamp, date} objects
            // timestamp is ISO string YYYY-MM-DDTHH:MM:SS or empty
            // date is YYYY-MM-DD or empty string
            const result = [];
            for (const line of lines) {
                const trimmed = line.trim();
                if (!trimmed) continue;

                let url, timestamp;
                if (trimmed.includes('|')) {
                    const lastSep = trimmed.lastIndexOf('|');
                    url = trimmed.substring(0, lastSep);
                    timestamp = trimmed.substring(lastSep + 1);
                } else {
                    url = trimmed;
                    timestamp = '';
                }

                const date = timestamp ? timestamp.substring(0, 10) : '';
                result.push({ url: toTgUrl(url), timestamp, date });
            }
            return result;
        }

        function groupByDate(proxies) {
            // Groups proxies by date, sorts groups by date DESC
            // Returns array of {date, label, proxies} where date is YYYY-MM-DD or '' for unknown
            const groups = {};
            const today = new Date().toISOString().substring(0, 10);
            const yesterday = new Date(Date.now() - 86400000).toISOString().substring(0, 10);

            for (const p of proxies) {
                let label;
                if (!p.date) {
                    label = 'Unknown date';
                } else if (p.date === today) {
                    label = 'Today';
                } else if (p.date === yesterday) {
                    label = 'Yesterday';
                } else {
                    label = formatDate(p.date);
                }

                if (!groups[label]) {
                    groups[label] = {
                        date: p.date || '',
                        label: label,
                        proxies: []
                    };
                }
                groups[label].proxies.push(p);
            }

            for (const group of Object.values(groups)) {
                group.proxies.sort((a, b) => {
                    if (a.timestamp === b.timestamp) return 0;
                    if (!a.timestamp) return 1;
                    if (!b.timestamp) return -1;
                    return b.timestamp.localeCompare(a.timestamp);
                });
            }

            // Sort groups by date DESC (newest first)
            // Unknown date goes last
            const sorted = Object.values(groups).sort((a, b) => {
                if (a.date === '') return 1;  // unknown last
                if (b.date === '') return -1;
                // Descending: a > b means a comes first (newer date)
                if (a.date > b.date) return -1;
                if (a.date < b.date) return 1;
                return 0;
            });

            return sorted;
        }

        async function loadProxies() {
            const container = document.getElementById('proxy-list');
            const countEl = document.getElementById('count');

            try {
                const response = await fetch(PROXIES_URL, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error('Failed to fetch: ' + response.status);
                }
                const text = await response.text();
                const lines = text.trim().split('\n');

                const proxies = parseProxies(lines);
                const groups = groupByDate(proxies);

                const totalProxies = proxies.length;
                countEl.textContent = totalProxies + ' proxy(ies)';

                if (totalProxies === 0) {
                    container.innerHTML = '<div class="state">No proxies yet. Check back later.</div>';
                    return;
                }

                container.innerHTML = '';

                for (const group of groups) {
                    // Add date divider
                    const divider = document.createElement('div');
                    divider.className = 'date-divider';
                    divider.innerHTML = '<span class="date-divider-text">' + group.label + '</span>';
                    container.appendChild(divider);

                    for (const p of group.proxies) {
                        const item = document.createElement('div');
                        item.className = 'proxy-item';

                        const link = document.createElement('a');
                        link.className = 'proxy-url';
                        link.href = p.url;
                        link.target = '_blank';
                        link.rel = 'noopener noreferrer';
                        link.textContent = p.url;

                        const btn = document.createElement('button');
                        btn.className = 'copy-btn';
                        btn.setAttribute('aria-label', 'Copy proxy URL');
                        btn.dataset.url = p.url;
                        btn.textContent = 'Copy';

                        const chip = document.createElement('span');
                        chip.className = 'ping-chip pending';
                        chip.textContent = '...';
                        chip.setAttribute('aria-label', 'TLS handshake status');

                        item.appendChild(link);
                        item.appendChild(chip);
                        item.appendChild(btn);
                        container.appendChild(item);

                        startPingChip(chip, p.url);
                    }
                }
            } catch (err) {
                countEl.textContent = '';
                container.innerHTML = '<div class="state">Failed to load proxies. Refresh to retry.</div>';
            }
        }

        document.addEventListener('click', function (e) {
            const btn = e.target.closest('.copy-btn');
            if (!btn) return;

            const url = btn.dataset.url;
            if (!url) return;

            if (!navigator.clipboard) {
                btn.textContent = 'No API';
                return;
            }
            navigator.clipboard.writeText(url).then(() => {
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = 'Copy';
                    btn.classList.remove('copied');
                }, 1500);
            }).catch(() => {
                btn.textContent = 'Error';
                setTimeout(() => {
                    btn.textContent = 'Copy';
                }, 1500);
            });
        });

        function parseProxyEndpoint(tgUrl) {
            const serverMatch = tgUrl.match(/[?&]server=([^&]+)/);
            const portMatch = tgUrl.match(/[?&]port=(\d+)/);
            if (!serverMatch || !portMatch) return null;
            return { server: decodeURIComponent(serverMatch[1]), port: portMatch[1] };
        }

        async function pingProxy(server, port) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 5000);
            const start = performance.now();
            try {
                await fetch('https://' + server + ':' + port + '/', {
                    mode: 'no-cors',
                    signal: controller.signal,
                    cache: 'no-store'
                });
                clearTimeout(timer);
                return { ok: true, ms: Math.round(performance.now() - start) };
            } catch (e) {
                clearTimeout(timer);
                const ms = Math.round(performance.now() - start);
                if (e.name === 'AbortError') {
                    return { ok: false, timeout: true, ms: ms };
                }
                // Fast error = server responded (TLS cert error, connection reset, etc.)
                // This means the proxy is alive — it's just not an HTTPS web server.
                // Slow error near the abort threshold = effectively a timeout.
                if (ms > 4500) {
                    return { ok: false, timeout: true, ms: ms };
                }
                return { ok: true, ms: ms };
            }
        }

        function startPingChip(chip, tgUrl) {
            const ep = parseProxyEndpoint(tgUrl);
            if (!ep) {
                chip.className = 'ping-chip timeout';
                chip.textContent = 'N/A';
                return;
            }

            async function doPing() {
                chip.className = 'ping-chip pending';
                chip.textContent = '...';
                const result = await pingProxy(ep.server, ep.port);
                if (result.ok) {
                    chip.className = 'ping-chip ok';
                    chip.textContent = result.ms + 'ms';
                } else {
                    chip.className = 'ping-chip timeout';
                    chip.textContent = 'T/O';
                }
            }

            doPing();
            setInterval(doPing, 10000);
        }

        loadProxies();
    </script>
